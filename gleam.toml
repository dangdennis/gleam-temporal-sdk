name = "temporal_gleam"
version = "0.1.0"
description = "A Temporal SDK for Gleam on the BEAM, built on Temporal's sdk-core"
target = "erlang"
licences = ["MIT"]
repository = { type = "github", user = "dangdennis", repo = "gleam-temporal-sdk" }
internal_modules = ["temporal/internal", "temporal/internal/*"]

[dependencies]
gleam_stdlib = ">= 0.60.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
