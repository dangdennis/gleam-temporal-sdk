[package]
name = "temporal_nif"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
rustler = "0.37"
temporalio-sdk-core = "0.11.0"
temporalio-client = "1.2.0"
temporalio-common = "1.2.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
prost = "0.14"
futures-util = "0.3"
tonic = "0.14"
prost-wkt-types = "0.7"
uuid = { version = "1", features = ["v4"] }
temporalio-protos = { version = "0.11.0", features = ["vendored-protox"] }
