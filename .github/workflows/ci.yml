name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, because the Temporal CLI and the runners move underneath an unchanged tree.
  schedule:
    - cron: "17 5 * * 1"

# Actions are pinned to commits; nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "27"
          gleam-version: "1.19.2"
          rebar3-version: "3"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: native/temporal_nif

      - name: Check formatting
        run: |
          gleam format --check src test codegen/src examples/src examples/test
          cargo fmt --check --manifest-path native/temporal_nif/Cargo.toml

      # The Rust boundary types are generated from the Gleam ones and committed.
      - name: Check the generated boundary types are current
        run: |
          bin/codegen
          git diff --exit-code native/temporal_nif/src/bridge.rs

      - name: Lint the NIF
        run: cargo clippy --release --manifest-path native/temporal_nif/Cargo.toml -- -D warnings

      - name: Build the API docs
        run: gleam docs build

  # Everything, on every machine a prebuilt library is published for.
  test:
    name: test (${{ matrix.name }}, OTP ${{ matrix.otp }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86-64, os: ubuntu-24.04, otp: "27" }
          - { name: Linux x86-64, os: ubuntu-24.04, otp: "28" }
          - { name: Linux ARM, os: ubuntu-24.04-arm, otp: "27" }
          - { name: macOS ARM, os: macos-15, otp: "27" }
          - { name: macOS Intel, os: macos-15-intel, otp: "27" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: ${{ matrix.otp }}
          gleam-version: "1.19.2"
          rebar3-version: "3"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: native/temporal_nif
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: temporalio/setup-temporal@1059a504f87e7fa2f385e3fa40d1aa7e62f1c6ca # v0

      # Builds the NIF, starts a dev server, runs every test, then replays this SDK's
      # histories on the TypeScript SDK.
      - name: Test and check conformance
        run: bin/conformance

      # Every example under examples/ runs against a dev server and has its result checked.
      - name: Run the examples
        run: bin/examples

      - name: Load test
        run: LOAD_WORKFLOWS=500 bin/load

  # Alpine: the library is built and the tests run inside Alpine containers.
  test-musl:
    name: test (Alpine ${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86-64, os: ubuntu-24.04 }
          - { name: ARM, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: native/temporal_nif/target/musl
          key: musl-${{ matrix.os }}-${{ hashFiles('native/temporal_nif/Cargo.lock') }}
      - name: Build the NIF and run the tests in Alpine
        run: bin/test-musl
