name: Release

# Pushing a version tag builds the NIF for each supported machine and attaches the files to a
# GitHub release, where `gleam run -m temporal/install` finds them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the package version
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' gleam.toml)" = "$GITHUB_REF_NAME"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --generate-notes

  nif:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            built: libtemporal_nif.so
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            built: libtemporal_nif.so
          - os: macos-14
            target: aarch64-apple-darwin
            built: libtemporal_nif.dylib
          - os: macos-15-intel
            target: x86_64-apple-darwin
            built: libtemporal_nif.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/temporal_nif
      - name: Build
        run: cargo build --release --manifest-path native/temporal_nif/Cargo.toml
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "native/temporal_nif/target/release/${{ matrix.built }}" "libtemporal_nif-${{ matrix.target }}.so"
          gh release upload "$GITHUB_REF_NAME" "libtemporal_nif-${{ matrix.target }}.so" --clobber
