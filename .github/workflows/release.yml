name: Release

# Step two of a release: pushing the tag v<version> publishes the draft release that the
# Prepare release workflow built, after checking that the tagged commit is the one that was
# built plus its checksums, and that the draft's files match those checksums.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check the tag matches the package version
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' gleam.toml)" = "$TAG"
      - name: Check CI passed on this commit
        run: |
          passed="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)"
          test "$passed" -gt 0 || { echo "no successful CI run for $GITHUB_SHA"; exit 1; }
      - name: Check the tagged commit is the built one plus its checksums
        run: |
          read -r _ version built < priv/checksums.txt
          test "$version" = "$TAG" || { echo "priv/checksums.txt is for $version, not $TAG"; exit 1; }
          changed="$(git diff --name-only "$built" HEAD)"
          test "$changed" = "priv/checksums.txt" || {
            echo "the tag differs from the commit the libraries were built from ($built) in more than priv/checksums.txt:"
            echo "$changed"
            exit 1
          }
      - name: Check the draft's libraries against the checksums
        run: |
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true"
          mkdir libraries && cd libraries
          gh release download "$TAG"
          test "$(ls | wc -l)" -eq 6
          grep -v '^#' ../priv/checksums.txt | sha256sum --check --strict
      - name: Publish
        run: gh release edit "$TAG" --draft=false --verify-tag
