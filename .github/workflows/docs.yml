name: Docs

# Publishes the API reference to GitHub Pages for each release, or when run by hand.
# Needs Pages enabled once: Settings, Pages, Source "GitHub Actions".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.19.2"
          rebar3-version: "3"
      - run: gleam docs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/dev/docs/temporal_gleam
      - id: deploy
        uses: actions/deploy-pages@v4
