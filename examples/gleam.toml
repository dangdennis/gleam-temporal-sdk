name = "temporal_examples"
version = "0.1.0"
description = "Runnable examples for temporal_gleam, one module per pattern"
target = "erlang"

[dependencies]
temporal_gleam = { path = ".." }
gleam_stdlib = ">= 0.60.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
envoy = ">= 1.0.0 and < 2.0.0"
argv = ">= 1.0.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
